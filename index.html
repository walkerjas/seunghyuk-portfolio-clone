</style></head><body><div class="grid"></div><div class="noise"></div><nav class="nav"><button data-panel="about">KIM SEUNGHYUK</button><div class="center-nav"><button data-panel="about">ABOUT ME</button><button data-panel="portfolio">PORTFOLIO</button></div><div class="right"><button data-panel="contact">CONTACT</button><span class="lang"><button>KO</button><span>—</span><button class="active">EN</button></span></div><button class="sound">SOUND — OFF</button></nav><main><div class="scene"><div class="object"><div class="plane"></div><div class="plane"></div><div class="plane"></div><div class="ring"></div><div class="dot"></div></div></div><div class="bottom-left">Graphic Designer — Seoul</div><div class="hint">SCROLL OR DRAG TO EXPLORE</div><div class="awards">FWA · AWWWARDS</div><section class="panel"><button class="close">&lt; GO BACK</button><h1 id="panel-title"></h1><p id="panel-copy"></p><div class="index" id="panel-index"></div></section></main><script>const data={about:['About me','Graphic designer in Seoul. I work across B2B proposals, presentations, brand systems and 3D product concepts.'],portfolio:['Portfolio','Selected projects across strategy, visual identity, digital products and interactive direction.'],contact:['Contact','For collaborations and new opportunities, write to sh@seunghyuk.com.']};const panel=document.querySelector('.panel');function open(k){document.body.classList.add('show-panel');document.getElementById('panel-title').textContent=data[k][0];document.getElementById('panel-copy').textContent=data[k][1];document.getElementById('panel-index').innerHTML=k==='portfolio'?['TRACE PEN','HOLD','SAMSUNG × PENSION POOL','NATIONAL HERITAGE','KYOBO READING MGMT','SKT VISION AI CARE'].map(x=>`<button>${x} ↗</button>`).join(''):''}document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>open(b.dataset.panel));document.querySelector('.close').onclick=()=>document.body.classList.remove('show-panel');document.querySelector('.sound').onclick=e=>e.currentTarget.textContent=e.currentTarget.textContent==='SOUND — OFF'?'SOUND — ON':'SOUND — OFF';document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lang button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});</script></body></html>
